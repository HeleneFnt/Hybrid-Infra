#cloud-config
hostname: ${hostname}
ssh_pwauth: false
ssh_authorized_keys:
  - ${ssh_key}
users:
  - name: "ubuntu"
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    groups: users, ubuntu
    home: /home/rocky
    shell: "/bin/bash"
    ssh_authorized_keys:

package_update: true
packages:
  - qemu-guest-agent
runcmd:
  - [ systemctl, enable, --now, qemu-guest-agent ]